<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TS Proxy Input</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    input {
      width: 80%;
      padding: 0.5rem;
      font-size: 1rem;
      border-radius: 6px;
      border: none;
      margin-bottom: 1rem;
    }
    button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      background: #4caf50;
      color: white;
      cursor: pointer;
    }
    iframe {
      margin-top: 2rem;
      width: 80%;
      height: 400px;
      border: none;
    }
  </style>
</head>
<body>
  <h1>TS Proxy Player</h1>
  <input id="tsUrl" placeholder="Enter TS or M3U8 URL..." />
  <button onclick="loadProxy()">Load via Proxy</button>
  <iframe id="playerFrame" allowfullscreen></iframe>

  <script>
    function loadProxy() {
      const url = document.getElementById("tsUrl").value.trim();
      if (!url) return alert("Please enter a URL");

      // Assuming the proxy is hosted at /api/ts-proxy?url=
      const proxied = `/api/ts-proxy?url=${encodeURIComponent(url)}`;

      document.getElementById("playerFrame").src = proxied;
    }
  </script>
</body>
</html>
